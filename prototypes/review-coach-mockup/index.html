<html lang="en">
<head>
<meta charset="utf-8">
<title>MOCKUP · Daily Review as a coach</title>
<style>
:root{--ground:#f7f3ea;--card:#fff;--ink:#1c1b19;--muted:#55524b;--line:#d9d3c5;--focus:#1f5fbf;--warning-ground:#fff4dd;--warning-line:#b26b00;--stop:#a3261b;--stop-ground:#f7e3e0;--target:#1d6b34;--target-ground:#e2f0e5;--info-ground:#e4edfa;--info-ink:#163b75;--neutral-ground:#ece7da;--tint:#f3efe6;--up-light:#c2e2c9;--dn-light:#f2c6c0;--ghost:#8f8a7e;--amber:#8a5200;--radius:14px;
 font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--ground);line-height:1.4}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);font-size:15px;min-width:1180px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.fig{font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--target)}.down{color:var(--stop)}.amber{color:var(--amber)}
.muted{color:var(--muted)}.small{font-size:.85rem}.b{font-weight:650}
.nw{white-space:nowrap}

/* mockup bar */
.proto{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;display:flex;gap:10px;align-items:center;padding:6px 14px;min-height:46px}
.proto .tag{background:var(--warning-ground);color:var(--ink);border-radius:999px;padding:0 8px;font-size:.72rem;font-weight:750;letter-spacing:.04em}
.proto .scn{display:flex;gap:4px;flex-wrap:wrap}
.proto button{background:transparent;color:#fff;border:1.5px solid #fff5;border-radius:999px;padding:3px 11px;cursor:pointer;font-size:.86rem;font-weight:600;min-height:30px}
.proto button[aria-pressed=true]{background:#fff;color:var(--ink);border-color:#fff}
.proto .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.proto .lbl{font-size:.8rem;color:#fffb}

.shell{display:flex;align-items:flex-start}
.nav{width:210px;flex:none;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 46px);padding:22px 14px;position:sticky;top:46px}
.nav .brand{font-weight:700;font-size:1.05rem;padding:0 14px 16px}
.nav button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer}
.nav button.on{background:var(--ink);color:#fff}
main{flex:1 1 auto;max-width:1070px;margin:0 auto;padding:18px 24px 120px;min-width:0}
h1{font-size:1.4rem;margin-bottom:12px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;margin:0 0 12px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--ink);border-radius:999px;padding:0 9px;font-size:.78rem;font-weight:650;background:var(--neutral-ground);white-space:nowrap;line-height:1.55}
.c-stop{color:#fff;background:var(--stop);border-color:var(--stop)}
.c-target{color:#fff;background:var(--target);border-color:var(--target)}
.c-amber{color:var(--amber);background:var(--warning-ground);border-color:var(--warning-line)}
.c-quiet{color:var(--muted);background:var(--tint);border-color:var(--line)}
.c-toward{color:var(--target);background:var(--target-ground);border-color:var(--target)}
.c-ink{color:#fff;background:var(--ink)}
.btn{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:5px 16px;font-weight:650;min-height:38px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--ink);color:#fff}
.btn.small{min-height:30px;padding:1px 11px;font-size:.85rem;border-width:1.5px}
.btn.quiet{border-color:var(--line);color:var(--muted);font-weight:550}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;font-weight:550;color:var(--ink)}
.link.muted{color:var(--muted);font-weight:450}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sg{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--info-ground);color:var(--info-ink);border:1px solid var(--focus);font-size:.66rem;font-weight:700;font-style:normal;vertical-align:middle;margin:0 3px;cursor:help;line-height:1}
body.nosug .sg{display:none}

/* day card */
.day-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.day-date{font-size:.9rem;color:var(--muted);font-weight:600}
.day-count{font-size:1.25rem;font-weight:700;margin:2px 0 8px}
.steps{display:flex;gap:6px;font-size:.82rem;font-weight:650}
.steps span{border:1.5px solid var(--line);border-radius:999px;padding:2px 11px;color:var(--muted);background:var(--tint)}
.steps span.now{border-color:var(--ink);color:var(--ink);background:#fff}
.steps span.ok{border-color:var(--target);color:var(--target);background:var(--target-ground)}
.tlist{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 28px}
.tlist li{display:flex;gap:8px;align-items:center;font-size:.92rem;min-width:0}
.tlist .t{font-weight:700;min-width:44px;text-align:left}
.note{margin-top:10px;padding:8px 12px;border-left:4px solid var(--warning-line);background:var(--warning-ground);border-radius:0 8px 8px 0;font-size:.93rem}
.note.red{border-left-color:var(--stop);background:var(--stop-ground)}
.note.plain{border-left-color:var(--line);background:var(--tint)}
.sum{display:grid;grid-template-columns:120px minmax(0,1fr);gap:7px 14px;margin-top:10px}
.sum dt{color:var(--muted);font-weight:600}.sum dd{margin:0}
.sum ul{margin:0;padding-left:18px}
.done-head{display:flex;gap:10px;align-items:center}
.done-head .chip{font-size:.9rem;padding:1px 12px}

/* marks grid */
.mk-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.mk-title h2{font-size:1.05rem}
table.mk{border-collapse:collapse;width:100%}
table.mk th{font-size:.78rem;color:var(--muted);font-weight:650;text-align:right;padding:4px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.mk th:first-child,table.mk td:first-child{text-align:left;padding-left:0}
table.mk td{padding:3px 10px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;height:40px}
table.mk tr.grp td{border-top:1px solid var(--tint)}
table.mk td.fb{text-align:left;width:46%;font-size:.9rem}
table.mk td.inst{font-weight:600}
table.mk td.inst small{font-weight:450;color:var(--muted)}
input.mk{width:104px;text-align:right;padding:5px 8px;border:1.5px dashed var(--ghost);border-radius:8px;background:var(--tint);font-variant-numeric:tabular-nums}
input.mk.has{border-style:solid;border-color:var(--ink);background:#fff}
input.mk.saved{border-style:solid;border-color:var(--line);background:#fff}
input.mk.bad{border-color:var(--stop);border-style:solid;background:var(--stop-ground)}
input.mk.q{border-color:var(--warning-line);border-style:solid;background:var(--warning-ground)}
.mk-foot{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.keys{font-size:.8rem;color:var(--muted)}
kbd{font:inherit;font-size:.74rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#fff}
.demo{margin-top:10px;padding:6px 10px;border:1px dashed var(--focus);border-radius:8px;background:var(--info-ground);color:var(--info-ink);font-size:.82rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo .btn{border-color:var(--info-ink);color:var(--info-ink)}
.np-in{width:200px;padding:3px 8px;border:1.5px solid var(--ink);border-radius:8px}

/* trade cards */
.grp-title{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:18px 0 6px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin:0 0 8px;scroll-margin-top:54px}
.tcard.open{border-color:var(--ink);box-shadow:0 1px 0 var(--ink)}
.thead{display:grid;grid-template-columns:54px minmax(0,auto) auto 1fr auto auto 130px auto;gap:10px;align-items:center;width:100%;background:none;border:0;padding:11px 18px;text-align:left;cursor:pointer;border-radius:var(--radius)}
.thead .sym{font-weight:750;font-size:1.05rem}
.thead .pos{color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thead .hp{font-weight:700;text-align:right}
.thead .hd{font-size:.84rem;text-align:right}.faded{opacity:.5}
.thead .todo{font-size:.84rem;font-weight:650;text-align:right;white-space:nowrap}
.thead .todo.ok{color:var(--target)}
.tbody{padding:0 18px 16px;border-top:1px solid var(--line)}
.last{padding:7px 0 6px;font-size:.93rem}
.last q,.trail q{quotes:'“' '”'}
.pn{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,8fr);gap:14px}
.pn>div{background:var(--tint);border-radius:10px;padding:8px 14px}
.pn h4,.blk h4{font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px;margin:0;font-size:.92rem}
dl.kv dt{color:var(--muted);white-space:nowrap}
dl.kv dd{margin:0}
dl.kv dd small{color:var(--muted);font-size:.84rem}
.waits{margin:10px 0 0;font-weight:650}
.meterblk{margin-top:8px;padding:6px 14px 7px;border:1px solid var(--line);border-radius:10px}
.meterrow{display:flex;gap:18px;align-items:center}
.key{display:flex;gap:12px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);margin-top:2px}
.key i{display:inline-block;width:14px;height:9px;margin-right:4px;vertical-align:baseline;border-radius:2px}
.sent{font-size:.93rem;margin-top:3px}
.rp{margin-top:8px;display:flex;gap:14px;align-items:center;padding:5px 14px;border:1.5px solid var(--ink);border-radius:10px;background:#fff}
.rp .rtxt{flex:1 1 auto;min-width:0;font-size:.95rem}
.rp .rtxt b{font-weight:650}
.act{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:18px;margin-top:10px}
.act h4{font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ask{font-weight:650;margin-bottom:7px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:4px 15px;font-weight:650;min-height:36px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.seg.sm button{min-height:30px;padding:1px 11px;font-size:.88rem}
.hint{font-size:.86rem;color:var(--muted);margin:5px 0 0}
.fld{margin-top:7px}
.fld label{display:block;font-weight:650;font-size:.92rem;margin-bottom:3px}
.fld label small{font-weight:450;color:var(--muted)}
textarea{width:100%;border:1.5px solid var(--ink);border-radius:9px;padding:6px 9px;resize:vertical;min-height:54px;background:#fff}
textarea.bad{border-color:var(--stop);background:var(--stop-ground)}
.errmsg{color:var(--stop);font-weight:650;font-size:.88rem;margin-top:3px}
details.more{margin-top:8px}
details.more summary{cursor:pointer;font-size:.88rem;color:var(--muted);font-weight:600}
.trail{background:var(--tint);border-radius:10px;padding:10px 14px;align-self:start;font-size:.9rem}
.trail ol{list-style:none;margin:0;padding:0}
.trail li{padding:4px 0;border-top:1px solid var(--line)}
.trail li:first-child{border-top:0}
.trail .when{font-weight:650}
.streak{font-weight:700;color:var(--stop);margin-bottom:4px}
.locked{margin-top:12px;padding:10px 14px;border:1.5px dashed var(--ghost);border-radius:10px;color:var(--muted)}
.refuse{margin:0 18px 10px;padding:8px 12px;border:1.5px solid var(--stop);background:var(--stop-ground);border-radius:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.saved-act{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--target-ground);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.settle{margin-top:12px;border:1.5px solid var(--ink);border-radius:10px;padding:12px 14px}
.settle .fin{font-size:1.05rem;font-weight:700}
.settle .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.inl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.inl input{width:92px;padding:4px 8px;border:1.5px solid var(--ink);border-radius:8px;text-align:right}
table.pr{border-collapse:collapse;width:100%;margin-top:8px;font-size:.93rem}
table.pr th{text-align:left;color:var(--muted);font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;padding:4px 12px 4px 0;border-bottom:1px solid var(--line)}
table.pr td{padding:5px 12px 5px 0;border-bottom:1px solid var(--tint);vertical-align:top}
table.pr td:first-child{color:var(--muted);white-space:nowrap}
.crfoot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;gap:16px}
.decl{margin-top:10px;padding:10px 14px;border:1px dashed var(--ghost);border-radius:10px}

/* replay overlay */
.ov{position:fixed;inset:0;z-index:50;background:var(--ground);overflow:auto;display:none}
.ov.on{display:block}
.ov header{display:flex;justify-content:space-between;align-items:center;padding:10px 22px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:2}
.ov header .ttl{font-size:.82rem;letter-spacing:.09em;text-transform:uppercase;font-weight:750;color:var(--muted)}
.ov-body{max-width:1220px;margin:0 auto;padding:14px 22px 60px;display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px;align-items:start}
.hero{border-left:6px solid var(--ghost)}
.hero.is-up{border-left-color:var(--target)}.hero.is-down{border-left-color:var(--stop)}
.hero .big{font-size:1.5rem;font-weight:750}
.hero .ln{margin-top:3px;font-size:.95rem}
.slide{display:flex;gap:10px;align-items:center;margin:10px 0 4px}
.slide input[type=range]{flex:1 1 auto;accent-color:var(--ink);height:32px}
.step{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:1.1rem}
.step:disabled{opacity:.4}
.moms{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0 2px}
.moms select{font:inherit;font-weight:600;padding:5px 8px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;min-height:34px;max-width:360px;cursor:pointer}
.momtxt.none{background:var(--tint);border-left-color:var(--line);color:var(--muted)}
.cfgl{margin-top:8px;font-size:.84rem;color:var(--muted)}
.refl{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.refl h4{font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.rdec{margin:2px 0}
.momtxt{margin-top:6px;padding:8px 12px;background:var(--warning-ground);border-left:4px solid var(--warning-line);border-radius:0 8px 8px 0}
.read h4{font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
.read h4:first-child{margin-top:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid;margin-right:4px;vertical-align:middle}
fieldset{border:0;padding:0;margin:0;min-width:0}
fieldset:disabled{opacity:.45}

.dlg{position:fixed;inset:0;z-index:80;background:#1c1b1966;display:none;align-items:center;justify-content:center}
.dlg.on{display:flex}
.dlg>div{background:#fff;border-radius:var(--radius);padding:18px 20px;max-width:420px;border:1px solid var(--ink)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;border-radius:999px;padding:8px 18px;font-size:.9rem;display:none;max-width:80vw}
.toast.on{display:block}

.chips{display:inline-flex;gap:6px;align-items:center}
.chip.old.c-stop{background:var(--stop-ground);color:var(--stop)}
.chip.old.c-target{background:var(--target-ground);color:var(--target)}
#daycard,#marks{scroll-margin-top:54px}
.key .hat{background:repeating-linear-gradient(45deg,#a3261b 0 2px,#f2c6c0 2px 5px)}
.key .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid #55524b;background:#fff}
.key .nowb{width:8px;height:12px;border:2px solid #1c1b19;background:#fff;vertical-align:-2px}
.key .tk{width:3px;height:12px;vertical-align:-2px;border-radius:0}
.conv{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.thead:hover{background:var(--tint)}
</style>
</head>
<body>
<div class="proto" id="proto"></div>
<div class="shell">
<nav class="nav" aria-label="Primary"><div class="brand">Trade Journal</div>
<button data-act="nav">Trades</button><button class="on" aria-current="page" data-act="review" id="nav-review">Review</button><button data-act="nav">New Plan</button><button data-act="nav">Accounts</button><button data-act="nav">Backup</button><button data-act="settings" id="nav-settings">Settings</button><button data-act="nav">About</button></nav>
<main id="main"></main>
</div>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="Replay"></div>
<div class="dlg" id="dlg"></div>
<div class="toast" id="toast" role="status"></div>
<script>

'use strict';
/* ---------- data: the coach's four example Trades ---------- */
const DATES=['2026-11-02','2026-11-03','2026-11-04','2026-11-05','2026-11-06','2026-11-09','2026-11-10','2026-11-11','2026-11-12','2026-11-13','2026-11-16','2026-11-17','2026-11-18','2026-11-19','2026-11-20'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dl=i=>{const a=DATES[i].split('-').map(Number);const dt=new Date(Date.UTC(a[0],a[1]-1,a[2]));return DOW[dt.getUTCDay()]+' '+MON[a[1]-1]+' '+a[2];};
const EXP=14;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const r2=x=>Math.round(x*100)/100;
const n2=x=>Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=(x,signed=true)=>x==null?'n/a':(x<-0.004?'−':(signed&&x>0.004?'+':''))+'$'+n2(x);
const usd=x=>x==null?'n/a':'$'+n2(x);
const rr=x=>(x<-0.004?'−':(x>0.004?'+':''))+Math.abs(x).toFixed(2)+'R';
const cls=x=>x>0.004?'up':(x<-0.004?'down':'');
const mh=x=>`<span class="fig ${cls(x)}">${money(x)}</span>`;
const SUG=['',"Yesterday's decision is remembered",'No easy Hold past a line; no Action without the Mark','Expiration says where it finished; assigned or exercised can wait','Plan and now, above the choice','Slips in a Mark are caught and fixed in place','Marks first, in one grid; Trades in attention order','The status card sums up; a finished day shows the day','Plain words, colour and figures on the closed card','The meter has a key and its sentence in print','Replay has a reason to be pressed, and is always there','Close Review tells the story; Decline is out of the way','One wording for Stop and Target, both measures','Keyboard and focus','Marks grid details','Form details'];
const sg=n=>`<em class="sg" title="Coach suggestion ${n}: ${esc(SUG[n])}">${n}</em>`;

function baseTrades(){return {
 AXIO:{id:'AXIO',kind:'stock',strategy:'Long Stock',side:1,mult:1,unit:'share',planQty:200,entry:50,
  stop:{on:'u',dir:'below',price:47},target:{on:'u',dir:'above',price:56},thesis:'Breakout.',wrongIf:'Below 47.',
  execs:[{d:0,q:200,p:50},{d:5,q:-100,p:45.6}],
  u:[49.70,49.90,49.20,48.60,48.10,45.20,45.80,44.90,44.30,45.10,44.00,43.20,43.60,42.80,42.10]},
 BREN:{id:'BREN',kind:'option',right:'Call',strike:100,strategy:'Long Call',side:1,mult:100,unit:'contract',planQty:4,entry:1.61,
  stop:{on:'o',dir:'below',price:0.80},target:{on:'o',dir:'above',price:4.00},thesis:'Base breakout over 98.',wrongIf:'Call back at $0.80.',closeReason:'Target reached',
  execs:[{d:0,q:4,p:1.61},{d:8,q:-2,p:4.00}],
  u:[97.20,97.00,97.30,97.10,97.20,98.50,100.20,101.80,103.60,104.60,104.00,105.20,104.80,106.00,106.50],

let S=null,uid=0;

function standing(t,d){
  if(d==null||!hasMarks(t,d))return {k:'none'};

/* ---------- sentences ---------- */
function meterSentence(t,d){
  const p=pl(t,d),st=standing(t,d),re=realized(t,d);let s='P&L '+money(p);
  if(st.k==='stop')s+=st.over<0.005?', at the Stop':', past the Stop by '+money(st.over,false);
  else if(st.k==='target')s+=st.over<0.005?', at the Target':', past the Target by '+money(st.over,false);
  else s+=', '+st.pct+'% of the way to the '+(st.to==='stop'?'Stop':'Target');
  s+='.';
  if(Math.abs(re)>0.004)s+=' Realized '+money(re)+', open '+money(p-re)+'.';
  const pd=d>t.execs[0].d?lastMarked(t,d-1):null;
  if(pd!=null){const pv=pl(t,pd);s+=' '+(p<pv?'Down from ':p>pv?'Up from ':'Unchanged from ')+money(pv)+' on '+dl(pd)+'.';}
  return s;
}
function fromHere(t,d){
  const p=pl(t,d),st=standing(t,d),re=realized(t,d),ps=plStop(t,d),pt=plTarget(t,d),h=Math.abs(held(t,d));
  if(st.k==='stop'){
    let s='From here: already '+money(st.over,false)+' past the Stop.';
    if(t.kind==='stock')s+=' Each $1.00 lower costs '+money(h*t.mult,false)+' more.';
    else{const e=expPL(t,d);if(e!=null)s+=' If '+t.id+' is at '+usd(mk(t,'u',d))+' at expiration: '+money(e)+'.';}
    return s;
  }
  const risk=r2(p-ps),op=p-re;
  let s='From here: '+money(risk,false)+' at risk '+(op>0.004?'back ':'')+'to the Stop';
  if(op>0.004)s+=' ('+money(Math.min(op,risk),false)+' of it open profit)';
  if(st.k==='target')s+='.';
  else{const rew=r2(pt-p);s+=', '+money(rew,false)+' to gain to the Target: '+(rew/risk).toFixed(2)+' to 1. It needs to work about '+Math.round(risk/(risk+rew)*100)+'% of the time to break even.';}
  if(ps>0.004)s+=' Even at the Stop this Trade ends '+money(ps,false)+' ahead.';
  else if(st.k==='target')s+=' At the Stop this Trade ends '+money(-ps,false)+' down.';

function meter(t,d,big){

/* Does an exit follow the Plan? The Plan's exit is all that is held, at the Stop or the Target, with no Hold past the line first.

function planCheck(t,q,price){
  const d=figDate(t),st=d==null?{k:'none'}:standing(t,d),h=Math.abs(held(t,S.date)),why=[];

  const name=which==='stop'?'Stop':'Target';

  const exitWord=t.side>0?'Sell':'Buy back',pc=planCheck(t);

   Exit:(pc.why.length?pc.why.map(w=>w.text).join(' ')+(pc.which?'':' Exiting now leaves the Plan.'):'The Plan’s exit: '+exitWord.toLowerCase()+' all '+units(t,Math.abs(held(t,S.date)))+' at the '+pc.name+'. No reason needed.')+' Record the '+closeWord(t)+' once it is done.',Roll:'Close this one and open a later one. Record the roll once it is done.',Adjust:'Move the Stop or Target, or change size. Record the change once it is done.'};

    <textarea id="why-${id}" data-in="why" data-id="${id}" rows="2" class="${e.why?'bad':''}" ${e.why?'aria-invalid="true"':''}>${esc(f.why)}</textarea>
    ${e.why?'<p class="errmsg" role="alert">Say why.</p>':''}</div>

  </div>${trail(t)}</div>`;
}
function settleBlock(t){
  const d=S.date,U=mk(t,'u',d),id=t.id,h=Math.abs(held(t,d)),long=t.side>0,w=ow(t);
  if(t.later)return `<div class="saved-act"><span><b>${t.later}, to record later.</b> Today’s Review can finish. The next Review asks again.</span><button class="btn small quiet" data-act="settle-undo" data-id="${id}">Change</button>${sg(3)}</div>`;
  const worthless=r2(realized(t,d)+(0-t.entry)*held(t,d)*t.mult),sold=`<button class="btn" data-act="sale" data-id="${id}">${long?'Sold':'Bought back'} before the close</button>`;
  if(U==null)return `<div class="settle"><p class="fin">${contract(t)} expired today.</p><p class="hint">No price for ${id}, so the app can’t say where it finished. What happened?</p><div class="opts"><button class="btn" data-act="settle-exp" data-id="${id}">Expired worthless</button><button class="btn" data-act="settle-later" data-id="${id}">${long?'Exercised':'Assigned'}: record later</button>${sold}</div></div>`;
  const itm=r2(intr(t,U)),e=expPL(t,d);
  if(itm>0.004){
    const explain=long?`Worth ${money(itm*h*t.mult,false)} at expiration: <span class="fig ${cls(e)}">${money(e)} · ${rr(e/R1(t))}</span> on the Trade. An in-the-money ${w} does not expire worthless: it is exercised or sold.`
      :`A short ${w} in the money is assigned: you ${t.right==='Put'?'buy':'sell'} ${h*100} shares at ${usd(t.strike)}. On the Trade: <span class="fig ${cls(e)}">${money(e)} · ${rr(e/R1(t))}</span>.`;
    const word=long?'Exercised':'Assigned';
    let s=`<div class="settle"><h4 class="muted small" style="text-transform:uppercase;letter-spacing:.07em">Expired ${dl(d)} · no Action needed${sg(3)}</h4>
     <p class="fin">${id} ${usd(U)}, strike ${usd(t.strike)}: <span class="${long?'up':'down'}">${usd(itm)} in the money</span></p><p style="margin-top:4px">${explain}</p>
     <div class="opts"><button class="btn primary" id="settle-main-${id}" data-act="settle-later" data-id="${id}">${word}: record later</button>${sold}<span style="flex:1"></span><button class="link muted" data-act="settle-worth" data-id="${id}">It expired worthless</button></div>
     <p class="hint">The app can’t record an ${long?'exercise':'assignment'} yet. This only lets today’s Review finish. The next Review asks again.</p>`;
    if(S.worth===id)s+=`<div class="decl"><p><b class="down">This books ${money(worthless)} · ${rr(worthless/R1(t))}</b> on ${long?'a '+w+' worth '+money(itm*h*t.mult,false):'a '+w+' that was '+usd(itm)+' in the money'}. Only if your broker shows it expired.</p>
      <div class="fld"><label for="worth-why">Why did it expire worthless?</label><textarea id="worth-why" data-in="worth-why" rows="2" class="${S.worthErr?'bad':''}"></textarea>${S.worthErr?'<p class="errmsg" role="alert">Say why.</p>':''}</div>
      <div class="row" style="margin-top:8px"><button class="btn" data-act="settle-worth-save" data-id="${id}">Record expiration anyway</button><button class="btn quiet" data-act="settle-worth-cancel">Cancel</button></div></div>`;
    return s+'</div>';
  }
  return `<div class="settle"><h4 class="muted small" style="text-transform:uppercase;letter-spacing:.07em">Expired ${dl(d)} · no Action needed${sg(3)}</h4>
   <p class="fin">${id} ${usd(U)}, ${U>t.strike?'above':(U<t.strike?'below':'at')} the ${usd(t.strike)} strike: expired worthless. ${long?'<span class="down">You lose the '+money(t.entry*h*t.mult,false)+' paid.</span>':'<span class="up">You keep '+money(t.entry*h*t.mult,false)+'.</span>'}</p>
   <div class="opts"><button class="btn primary" id="settle-main-${id}" data-act="settle-exp" data-id="${id}">Record expiration</button><span style="flex:1"></span><button class="link muted" data-act="sale" data-id="${id}">${long?'Sold it':'Bought it back'} before the close</button></div></div>`;
}
function tradeCard(t){
  const open=S.open===t.id,d=figDate(t),today=d===S.date;let b='';
  if(open){
    const mm=rowsOf(t).filter(missing).length,h=[lastLine(t)];
    (S.refl[t.id]||[]).forEach(r=>h.push(reflLine(t,r)));
    if(stale(t))h.push(staleBanner(t));
    if(S.sale&&S.sale.id===t.id)h.push(saleForm(t));
    if(!today&&!t.later)h.push(`<p class="waits" style="margin:0 0 8px">${mm?'Figures wait for today’s Marks.':'No price today.'} <span class="muted" style="font-weight:450">Below: at the ${d==null?'':dl(d)} Marks.</span>${sg(6)}</p>`);
    h.push(planNow(t,d));
    if(d!=null){h.push(meterBlock(t,d));h.push(replayStrip(t,d));}
    if(mm)h.push(`<div class="locked">No Action until today’s ${mm===1?'Mark is':'Marks are'} in. <button class="link" data-act="gomark" data-id="${t.id}">Enter ${mm===1?'it':'them'}</button>${sg(2)}</div>`);

function refuseBox(){
  const from=S.refuse.from;
  return `<div class="refuse" role="alert"><b>${from}’s note isn’t saved.</b><button class="btn small primary" id="refuse-save" data-act="refuse-save">Save it</button><button class="btn small" data-act="refuse-discard">Discard it</button><button class="link" data-act="refuse-back">Back to ${from}</button>${sg(13)}</div>`;
}
function planResult(t){
  const end=t.execs[t.execs.length-1].d,f0=t.execs[0].d,exits=t.execs.filter(e=>Math.sign(e.q)!==t.side),re=realized(t,end);
  const fs=firstEver(t,end,t.stop),ft=firstEver(t,end,t.target);
  const ex=exits.map(e=>e.kind==='exp'?'Expired worthless '+dl(e.d):(t.side>0?'Sold ':'Bought back ')+Math.abs(e.q)+' at '+usd(e.p)+', '+dl(e.d)).join('<br>');
  const rows=[['Entry',(t.side<0?'Sell ':'')+units(t,t.planQty)+' at '+usd(t.entry),(t.side<0?'Sold ':'Bought ')+Math.abs(t.execs[0].q)+' at '+usd(t.execs[0].p)+', '+dl(f0)],
   ['Stop',lineDef(t,'stop'),fs==null?'Never reached':'<span class="down b">Reached '+dl(fs)+'</span>'],
   ['Target',lineDef(t,'target'),ft==null?'Never reached':'<span class="up b">Reached '+dl(ft)+'</span>'],
   ['Exit','All at the Stop or the Target',ex],
   ['Result','<span class="fig">'+money(planReward(t))+' · '+rr(planReward(t)/R1(t))+'</span>','<span class="fig b '+cls(re)+'">'+money(re)+' · '+rr(re/R1(t))+'</span>']];
  return `<table class="pr"><thead><tr><th></th><th>Plan</th><th>What happened</th></tr></thead><tbody>${rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join('')}</tbody></table>`;
}
function howEnded(t){const le=t.execs[t.execs.length-1];return le.kind==='exp'?'expired worthless':(t.side>0?'sold all ':'bought back all ')+units(t,t.planQty);}
function closedCard(t){
  const end=t.execs[t.execs.length-1].d,f0=t.execs[0].d,re=realized(t,end),cr=S.cr[t.id]||{},open=S.open===t.id,id=t.id;
  const chip=cr.status==='owed'?(cr.due?'<span class="chip c-amber">Close Review due</span>':'<span class="chip c-quiet">Close Review · next Review</span>'):(cr.status==='done'?'<span class="chip c-toward">Close Review saved</span>':'<span class="chip c-quiet">Close Review declined</span>');

  let b='';

    let lo=0,lod=f0;for(let i=f0;i<end;i++){const v=pl(t,i);if(v!=null&&v<lo){lo=v;lod=i;}}

    h.push(planResult(t));

   <span class="sym">${id}</span><span class="pos">${howEnded(t).replace(/^./,c=>c.toUpperCase())} · ${dl(end)}</span><span class="chips">${chip}</span><span></span>
   <span class="hp fig ${cls(re)}">${money(re)} · ${rr(re/R1(t))}</span><span class="hd"></span><span></span><span class="todo ${todo==='Done'?'ok':''}">${todo}</span></button>${rf}${b}</div>`;

/* ---------- the day ---------- */
const joinAnd=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
function dayCard(){
  const open=openTrades(),d=S.date,mm=allRows().filter(missing).length,acts=open.filter(t=>!isExp(t)&&!S.today[t.id]).length,sets=open.filter(t=>isExp(t)&&!t.settled).length,crs=dueCR().length,done=mm+acts+sets+crs===0;
  const steps=`<div class="steps" aria-hidden="true"><span class="${mm?'now':'ok'}">1 Marks</span><span class="${mm?'':(acts+sets+crs?'now':'ok')}">2 Trades</span><span class="${done?'ok':''}">3 The day</span></div>`;
  if(done)return doneCard(steps);
  const parts=[];if(mm)parts.push(mm+(mm===1?' Mark':' Marks'));if(sets)parts.push(sets+(sets===1?' expiration':' expirations')+' to settle');if(acts)parts.push(acts+(acts===1?' Action':' Actions'));if(crs)parts.push(crs+' Close Review'+(crs===1?'':'s'));
  const nx=nextTodo();
  const nextBtn=mm?'<button class="btn primary" id="next" data-act="gomarks">Enter the Marks</button>':(nx?`<button class="btn primary" id="next" data-act="go" data-id="${nx.id}">Next: ${nx.id}${isOpen(nx)?'':'’s Close Review'}</button>`:'');
  let chg=0,all=open.length>0;open.forEach(t=>{const pd=lastMarked(t,d-1);if(hasMarks(t,d)&&pd!=null)chg+=pl(t,d)-pl(t,pd);else all=false;});

   <div class="row">${nextBtn}${all?`<span>Day so far: <span class="fig b ${cls(chg)}">${money(r2(chg))}</span></span>`:''}</div>`;
  const st=open.filter(stale);
  if(st.length&&!S.staleAck)for(const t of st){const hh=S.hist[t.id][S.prev];
    h+=`<div class="note"><b>${dl(S.prev)} you chose ${hh.a} on ${t.id}:</b> <q>${esc(hh.why)}</q> ${sinceTxt(t)}Still holding ${Math.abs(held(t,d))}.${sg(1)}<div class="row" style="margin-top:6px"><button class="btn small primary" data-act="sale" data-id="${t.id}">I ${t.side>0?'sold':'bought back'}: record it</button><button class="btn small" data-act="stale-ack">Still holding</button></div></div>`;}
  if(S.skipped.length)h+=`<p class="note plain"><b>No Review for ${S.skipped.map(dl).join(', ')}.</b> Their Marks are optional. ${S.extra?'':'<button class="link" data-act="extra">Add them</button>'}${sg(7)}</p>`;
  const list=open.concat(closedTrades().filter(t=>S.cr[t.id]&&S.cr[t.id].status==='owed'));
  h+='<ul class="tlist">'+list.map(t=>{
    if(!isOpen(t))return `<li><button class="link t" data-act="go" data-id="${t.id}">${t.id}</button><span class="chip ${S.cr[t.id].due?'c-amber':'c-quiet'}">Closed</span><span class="muted">${S.cr[t.id].due?'To do: Close Review':'Close Review due next Review'}</span></li>`;
    return `<li><button class="link t" data-act="go" data-id="${t.id}">${t.id}</button><span class="chips">${chipFor(t,true)}</span><span class="muted">${todoText(t)}</span></li>`;}).join('')+'</ul>';
  return h+'</section>';

function doneCard(steps){
  const open=openTrades(),d=S.date,live=open.filter(t=>!isExp(t));
  let chg=0,tot=0,n=0;open.forEach(t=>{const pd=lastMarked(t,d-1);if(hasMarks(t,d)){tot+=pl(t,d);n++;if(pd!=null)chg+=pl(t,d)-pl(t,pd);}});
  const k=t=>standing(t,figDate(t)).k,sIds=live.filter(t=>k(t)==='stop'),tIds=live.filter(t=>k(t)==='target');

    if(a.a==='Roll')tm.push(`<b>Roll ${t.id}</b>, then record the roll.`);

   <dl class="sum">
    ${n?`<dt>The day</dt><dd>Trade P&amp;L <span class="fig b ${cls(chg)}">${money(r2(chg))}</span> on the day · open Trades <span class="fig ${cls(tot)}">${money(r2(tot))}</span> in all</dd>`:''}

/* ---------- Marks ---------- */
const norm=s=>s.trim().replace(/^\$/,'').replace(/,/g,'');
const rowByKey=k=>{const a=k.split('-');return {t:T(a[0]),f:a[1]};};
function cell(r,d,main){
  const k=rkey(r,d),saved=mk(r.t,r.f,d),dr=S.drafts[k];
  if(main&&S.np[k])return '<span class="muted">No price</span>';
  const val=dr!=null?dr:(saved!=null?saved.toFixed(2):'');
  const c=S.err[k]?'bad':(S.ask[k]?'q':(dr!=null&&dr.trim()!==''?'has':(dr==null&&saved!=null?'saved':'')));
  return `<input class="mk ${c}" id="mk-${k}" data-key="${k}" data-main="${main?1:0}" inputmode="decimal" autocomplete="off" aria-label="${r.f==='u'?r.t.id:contract(r.t)} Mark, ${dl(d)}" value="${esc(val)}">`;
}
function fb(r){
  const d=S.date,k=rkey(r,d),dr=S.drafts[k],saved=mk(r.t,r.f,d),prev=lastMarkBefore(r,d);
  if(S.np[k])return `<span class="muted">${esc(S.np[k])}</span> <button class="link muted small" tabindex="-1" data-act="np-undo" data-key="${k}">Undo</button>`;
  if(S.npOpen===k)return `<input class="np-in" id="np-${k}" data-in="np" data-key="${k}" placeholder="Why no price? Halted, no quote…" aria-label="Why no price"> <button class="btn small" data-act="np-save" data-key="${k}">No price</button> <button class="link muted small" data-act="np-cancel" data-key="${k}">Cancel</button>`;
  if(S.err[k])return `<span class="errmsg" role="alert">${S.err[k]}</span>`;
  if(S.ask[k]){const q=S.ask[k];return `<span class="amber b" role="alert">${q.text}</span> `+q.opts.map((o,i)=>`<button class="btn small" data-act="ask" data-key="${k}" data-v="${o.v}" ${i===0?'id="ask-'+k+'"':''}>${o.label}</button>`).join(' ')+sg(5);}
  const v=dr!=null?parseFloat(norm(dr)):saved;let s='';
  if(v!=null&&!isNaN(v)&&prev!=null){const c=r2(v-prev);s=`<span class="fig ${cls(c)}">${money(c)}${prev?' ('+pctTxt(c/prev)+')':''}</span>`;}
  if(dr==null&&saved!=null)s+=' <span class="muted small">· saved</span>';
  if((dr==null||dr.trim()==='')&&saved==null)s+=`<button class="link muted small" tabindex="-1" data-act="np-open" data-key="${k}">Can’t get a price</button>`;
  return s;
}
function validate(k){
  const dr=S.drafts[k];delete S.err[k];delete S.ask[k];
  if(dr==null||dr.trim()==='')return true;
  const r=rowByKey(k),d=+k.split('-')[2],txt=norm(dr),prev=lastMarkBefore(r,d);
  if(!/^\d*\.?\d+$/.test(txt)&&!/^\d+\.$/.test(txt)){S.err[k]='Not a price. Digits only'+(prev!=null?', like '+prev.toFixed(2):'')+'.';return false;}
  const v=parseFloat(txt);
  if(v===0&&r.f==='u'){S.err[k]='A share price can’t be $0.00.';return false;}
  if(S.okd[k]!=null&&parseFloat(S.okd[k])===v)return true;
  if(v===0){if(d===EXP)return true;S.ask[k]={text:'Worth nothing?',opts:[{v:'0.00',label:'Yes, $0.00'},{v:'',label:'Retype'}]};return false;}
  if(prev){
    const q=v/prev,band=r.f==='u'?[1-CFG.stock/100,1+CFG.stock/100]:[1-CFG.optDown/100,1+CFG.optUp/100];
    if(q<band[0]||q>band[1]){
      const near=r.f==='u'?[0.8,1.2]:[0.4,2.5];
      const best=[v/10,v/100,v*10,v*100].map(r2).filter(c=>c/prev>=near[0]&&c/prev<=near[1]).sort((a,b)=>Math.abs(Math.log(a/prev))-Math.abs(Math.log(b/prev)))[0];
      S.ask[k]=best!=null?{text:usd(best)+' or '+usd(v)+'?',opts:[{v:best.toFixed(2),label:usd(best)},{v:v.toFixed(2),label:usd(v)}]}
        :{text:pctTxt(q-1)+' from '+usd(prev)+'. Right?',opts:[{v:v.toFixed(2),label:'Yes, '+usd(v)},{v:'',label:'Retype'}]};
      return false;
    }
  }
  return true;
}

/* ---------- Replay ---------- */
function moments(t){
  const f0=t.execs[0].d,end=lastOf(t),m={},e0=t.execs[0],le=t.execs[t.execs.length-1];
  const add=(d,name,text)=>{if(!m[d])m[d]={d,names:[],texts:[]};m[d].names.push(name);m[d].texts.push(text);};
  add(f0,'Entry',(t.side>0?'Bought ':'Sold ')+units(t,Math.abs(e0.q))+' at '+usd(e0.p)+'. Out if '+lineDef(t,'stop')+'. Target: '+lineDef(t,'target')+'.');
  const closed=held(t,end)===0,res=closed?realized(t,end):pl(t,end);
  let lo=0,lod=null,hi=0,hid=null;for(let i=f0;i<end;i++){const v=pl(t,i);if(v==null)continue;if(v<lo){lo=v;lod=i;}if(v>hi){hi=v;hid=i;}}
  if(!closed&&res!=null&&res<=lo)lod=null;
  if(lod!=null)add(lod,'Low','The worst session: '+money(lo)+' ('+rr(lo/R1(t))+').');
  const fs=firstEver(t,end,t.stop),ft=firstEver(t,end,t.target);
  if(fs!=null)add(fs,'Stop','First session past the Stop.');
  if(ft!=null)add(ft,'Target','Target first reached.');
  if(hid!=null&&res!=null&&hi>res+0.25*R1(t))add(hid,'High','The best session: '+money(hi)+'. '+(closed?'It ended ':'It is now ')+money(r2(hi-res),false)+' lower.');
  for(const e of t.execs.slice(1)){if(e.d!==end||!closed)add(e.d,'Sale',(t.side>0?'Sold ':'Bought back ')+Math.abs(e.q)+' at '+usd(e.p)+'.');}
  if(!closed)add(end,'Now',res==null?'A Mark is missing.':meterSentence(t,end));
  else add(end,'End',(le.kind==='exp'?'Expired worthless.':(t.side>0?'Sold the last ':'Bought back the last ')+Math.abs(le.q)+' at '+usd(le.p)+'.')+' Result '+money(res)+' ('+rr(res/R1(t))+').');
  return Object.values(m).sort((a,b)=>a.d-b.d).map(x=>({d:x.d,name:x.names.join(' + '),text:x.texts.join(' ')}));
}
const lastOf=t=>isOpen(t)?figDate(t):t.execs[t.execs.length-1].d;
function readout(t,d){
  const p=pl(t,d),re=realized(t,d),h=held(t,d),pd=d>t.execs[0].d?lastMarked(t,d-1):null,ac=actOn(t,d),ex=t.execs.filter(e=>e.d===d);
  let s='<h4>What you did that day'+sg(10)+'</h4>';
  if(ex.length)s+='<p class="b">'+ex.map(e=>e.kind==='exp'?'Expired worthless.':(e.q*t.side>0?(t.side>0?'Bought ':'Sold '):(t.side>0?'Sold ':'Bought back '))+Math.abs(e.q)+' at '+usd(e.p)+'.').join(' ')+'</p>';
  if(ac===null)s+='<p class="amber b">No Review this session.</p>';
  else if(ac)s+=`<p>Action: <b>${ac.a}</b>${ac.why?' · <q>'+esc(ac.why)+'</q>':' · <span class="muted">no reason given</span>'}</p>`;
  else if(d===S.date&&h!==0)s+='<p class="muted">Action: not chosen yet.</p>';
  else if(!ex.length)s+='<p class="muted">Nothing recorded.</p>';
  s+='<h4>How it stood</h4><dl class="kv">'+
   `<dt>Trade P&amp;L</dt><dd><span class="fig b ${cls(p)}">${p==null?'n/a':money(p)+' · '+rr(p/R1(t))}</span>${pd!=null&&p!=null?'<br><small class="fig">'+money(r2(p-pl(t,pd)))+' since '+dl(pd)+'</small>':''}</dd>`+
   `<dt>Realized</dt><dd class="fig">${money(re)}</dd><dt>Open</dt><dd class="fig">${p==null?'n/a':money(r2(p-re))}</dd>`+
   `<dt>${t.id}</dt><dd class="fig">${usd(mk(t,'u',d))}</dd>`+(t.kind==='option'?`<dt>${t.right}</dt><dd class="fig">${h===0?'n/a':usd(mk(t,'o',d))}</dd>`:'')+
   `<dt>Held</dt><dd class="fig">${Math.abs(h)} of ${units(t,t.planQty)}</dd>`;
  if(h!==0&&hasMarks(t,d))s+=`<dt>Stop</dt><dd>${lineText(t,d,'stop')}</dd><dt>Target</dt><dd>${lineText(t,d,'target')}</dd>`;
  if(t.kind==='option'&&h!==0)s+=`<dt>Expiration</dt><dd>${EXP-d===0?'today':(EXP-d)+' session'+(EXP-d===1?'':'s')}</dd>`;
  return s+'</dl>';
}

   <div class="ov-body"><div><div class="card hero" id="ov-hero"></div><div class="card" style="padding-top:8px"><div id="ov-moms"></div>
    <div class="slide"><button class="step" data-act="r-prev" id="r-prev" aria-label="Session before">‹</button><input type="range" id="r-slide" data-in="r-slide" step="1" aria-label="Session"><button class="step" data-act="r-next" id="r-next" aria-label="Next session">›</button><span class="b nw" id="ov-when"></span></div>

function updOv(){
  const R=S.replay,t=T(R.id),f0=t.execs[0].d,last=lastOf(t),d=R.sel=Math.max(f0,Math.min(last,R.sel)),p=pl(t,d),h=held(t,d);
  const sl=document.getElementById('r-slide');sl.min=f0;sl.max=last;if(+sl.value!==d)sl.value=d;

  document.getElementById('ov-when').textContent=dl(d)+' · '+(d-f0+1)+' of '+(last-f0+1);
  const st=h===0?{k:'closed'}:standing(t,d),lines=[];
  if(st.k==='closed')lines.push('Closed. Nothing held.');
  else if(p==null||st.k==='none')lines.push('A Mark is missing for this session.');

  else if(st.k==='target'){lines.push('<span class="up b">Target reached, '+money(st.over,false)+' past it.</span>');lines.push('Target first reached '+dl(firstEver(t,d,t.target))+'.');}
  else lines.push(st.pct+'% of the way to the '+(st.to==='stop'?'Stop':'Target')+'.');
  if(p!=null&&h!==0&&st.k!=='none')lines.push(esc(fromHere(t,d)));
  const hero=document.getElementById('ov-hero');
  hero.className='card hero '+(p>0.004?'is-up':(p<-0.004?'is-down':''));
  hero.innerHTML=`<span class="muted b">${dl(d)}</span> &nbsp;<span class="big fig ${cls(p)}">${p==null?'no Mark':money(p)+' · '+rr(p/R1(t))}</span>`+lines.map(l=>'<p class="ln">'+l+'</p>').join('');
  document.getElementById('ov-chart').innerHTML=chart(t,d,last);
  document.getElementById('ov-read').innerHTML=readout(t,d);
  const mo=document.getElementById('ov-moms');
  const close=R.mode==='close',ms=R.ms;R.mi=ms.findIndex(m=>m.d===d);
  let fresh=false;if(close&&R.mi>=0&&!R.seen[R.mi]){R.seen[R.mi]=true;fresh=true;}
  const seenN=ms.filter((m,i)=>R.seen[i]).length,all=close&&seenN===ms.length;

  mo.innerHTML=`<div class="moms"><label class="b" for="mom-sel">Key moments</label>${sg(10)}<select id="mom-sel" data-in="mom-sel">${R.mi<0?'<option value="" selected>Choose a moment</option>':''}${ms.map((m,i)=>`<option value="${i}"${R.mi===i?' selected':''}>${close&&R.seen[i]?'✓ ':''}${i+1}. ${m.name} · ${dl(m.d)}</option>`).join('')}</select>${close?(all?`<span class="up b">All ${ms.length} seen. Now write.</span>`:`<button class="btn small primary" data-act="mom-next" id="mom-next">Next moment</button><span class="muted small">${seenN} of ${ms.length} seen</span>`):''}</div>${R.mi>=0?`<p class="momtxt"><b>${dl(ms[R.mi].d)}.</b> ${esc(ms[R.mi].text)}</p>`:'<p class="momtxt none">No key moment this session.</p>'}`;
  if(aid){const x=document.getElementById(aid);if(x)x.focus();}

     :`<div class="fld"><label for="cr-${f.k}">${f.label}${f.req?'':' <small>(optional)</small>'}</label><textarea id="cr-${f.k}" data-in="cr-field" data-k="${f.k}" rows="${f.rows}" class="${e[f.k]?'bad':''}">${esc(a[f.k])}</textarea>${e[f.k]?`<p class="errmsg" role="alert">${f.err}</p>`:''}</div>`).join('')}

function dialog(title,text,yes,no,onYes){S.dialog={onYes};const d=document.getElementById('dlg');d.className='dlg on';
  d.innerHTML=`<div role="alertdialog" aria-label="${esc(title)}"><h2 style="font-size:1.05rem">${title}</h2><p style="margin:6px 0 14px">${text}</p><div class="row"><button class="btn primary" data-act="dlg-no" id="dlg-no">${no}</button><button class="btn" data-act="dlg-yes" id="dlg-yes">${yes}</button></div></div>`;document.getElementById('dlg-no').focus();}
function closeDlg(){S.dialog=null;const d=document.getElementById('dlg');d.className='dlg';d.innerHTML='';}
function render(o={}){
  const ae=document.activeElement;let keep=null;
  if(!o.focus&&ae&&ae.id){keep={id:ae.id};try{keep.s=ae.selectionStart;keep.e=ae.selectionEnd;}catch(_){}}
  document.body.classList.toggle('nosug',!S.sug);
  document.getElementById('proto').innerHTML='<span class="tag">MOCKUP</span><span class="lbl">Scenario</span><span class="scn">'+SCN.map(s=>`<button data-act="scn" data-k="${s[0]}" aria-pressed="${S.key===s[0]}">${s[1]}</button>`).join('')+`</span><span class="right"><button data-act="sug" aria-pressed="${S.sug}" title="Blue numbers mark where each of the coach’s 15 suggestions lands">Coach numbers</button><button data-act="restart">Restart</button></span>`;
  const open=openTrades(),closed=closedTrades().filter(t=>S.cr[t.id]);
  const onS=PAGE==='settings',nr=document.getElementById('nav-review'),ns=document.getElementById('nav-settings');
  nr.classList.toggle('on',!onS);ns.classList.toggle('on',onS);(onS?ns:nr).setAttribute('aria-current','page');(onS?nr:ns).removeAttribute('aria-current');
  document.getElementById('main').innerHTML=onS?settingsPage():'<h1>Review</h1>'+dayCard()+marksCard()+
    (open.length?`<p class="grp-title">Trades · most pressing first${sg(6)}${sg(8)}</p>`+open.map(tradeCard).join(''):'')+
    (closed.length?`<p class="grp-title">Closed · Close Review${sg(11)}</p>`+closed.map(closedCard).join(''):'');
  if(o.scroll){const el=document.querySelector(o.scroll);if(el)el.scrollIntoView({block:'start'});}
  if(o.focus){const el=document.querySelector(o.focus);if(el){el.focus({preventScroll:!!o.scroll});if(el.select&&el.tagName==='INPUT')el.select();}}
  else if(keep){const el=document.getElementById(keep.id);if(el&&el!==document.activeElement){el.focus({preventScroll:true});try{if(keep.s!=null)el.setSelectionRange(keep.s,keep.e);}catch(_){}}}
}
function openCard(id,force){
  if(S.open&&S.open!==id&&dirty(S.open)){S.refuse={at:id,from:S.open};render({focus:'#refuse-save'});return;}
  S.refuse=null;S.sale=null;S.decl=null;S.worth=null;
  S.open=(S.open===id&&!force)?null:id;
  render(S.open?{scroll:'#card-'+id,focus:'#head-'+id}:{focus:'#head-'+id});
}
function advance(then){
  const nx=then?T(then):nextTodo();
  if(nx){S.open=nx.id;render({scroll:'#card-'+nx.id,focus:'#head-'+nx.id});}
  else{S.open=null;render({scroll:'#daycard',focus:'#daycard'});}
}
function saveAction(id,then){
  const t=T(id),f=formOf(t),e={};
  if(!f.a)e.a=true;
  if(needWhy(t,f)&&!f.why.trim())e.why=true;
  if(e.a||e.why){S.ferr[id]=e;S.refuse=null;S.open=id;render({focus:e.a?'#act-'+id+'-Hold':'#why-'+id});return false;}
  delete S.ferr[id];S.today[id]={a:f.a,why:f.why.trim(),conv:f.conv,alt:f.alt,note:f.note};delete S.form[id];S.refuse=null;
  advance(then);return true;
}
function closeOut(t){
  S.cr[t.id]={status:'owed',due:false};delete S.today[t.id];delete S.form[t.id];
  Object.keys(S.drafts).forEach(k=>{if(k.indexOf(t.id+'-')===0)delete S.drafts[k];});
  S.sale=null;S.worth=null;S.justClosed=t.id;S.open=t.id;sortOrder();
  render({scroll:'#card-'+t.id,focus:'#carry-on'});
}
function afterCR(id){
  S.justClosed=null;
  if(dayDone()){S.open=null;render({scroll:'#daycard',focus:'#daycard'});}else render({focus:'#head-'+id});
}
const ACT={
  scn(el){PAGE='review';setup(el.dataset.k);try{history.replaceState(null,'','#'+S.key);}catch(_){}renderOv();closeDlg();render();window.scrollTo(0,0);},
  restart(){PAGE='review';setup(S.key);renderOv();closeDlg();render();window.scrollTo(0,0);},
  sug(){S.sug=!S.sug;render();if(S.replay)renderOv();},
  nav(el){const go=()=>toast('“'+el.textContent+'” is not part of this mockup.');
    if(unsaved()){const n=unsavedMarks(),id=S.ids.find(dirty);dialog('Leave without saving?',n?n+' unsaved Mark'+(n===1?'':'s')+'.':id+'’s Action note isn’t saved.','Leave','Stay',go);}else go();},
  'dlg-no'(){closeDlg();},
  'dlg-yes'(){const f=S.dialog&&S.dialog.onYes;closeDlg();if(f)f();},
  out(el){toast(el.dataset.t+' Not part of this mockup.');},
  toggle(el,id){openCard(id,false);},
  go(el,id){openCard(id,true);},
  gomarks(){S.marksOpen=true;render({scroll:'#marks',focus:firstEmpty()});},
  gomark(el,id){S.marksOpen=true;const r=rowsOf(T(id)).find(missing);render({scroll:'#marks',focus:r?'#mk-'+rkey(r,S.date):'#mk-save'});},
  'mk-edit'(){S.marksOpen=true;render({focus:'input.mk[data-main="1"]'});},
  'mk-discard'(){S.drafts={};S.err={};S.ask={};S.okd={};S.npOpen=null;S.msg='';render({focus:firstEmpty()});},
  'mk-save'(){
    let bad=null,n=0;
    for(const k of Object.keys(S.drafts)){if(!validate(k)){n++;if(!bad)bad=k;}}
    if(bad){S.msg=n+(n===1?' Mark':' Marks')+' to check first.';render({focus:S.ask[bad]?'#ask-'+bad:'#mk-'+bad});return;}
    for(const k of Object.keys(S.drafts)){const a=k.split('-'),txt=norm(S.drafts[k]);S.marks[a[0]][a[1]][+a[2]]=txt===''?null:parseFloat(txt);}
    S.drafts={};S.okd={};S.npOpen=null;afterMarks();
  },
  demo(el){
    const v=el.dataset.v;let slip=null;
    for(const r of allRows()){const k=rkey(r,S.date);if(!missing(r)||(S.drafts[k]||'').trim())continue;
      let val=r.t[r.f][S.date];if(v==='itm'&&r.t.id==='DALE')val=r.f==='u'?52:5.5;
      if(v==='slip'&&r.t.id==='AXIO'){S.drafts[k]='440';slip=k;continue;}
      S.drafts[k]=val.toFixed(2);S.okd[k]=val.toFixed(2);}
    if(slip)validate(slip);
    render({focus:slip&&S.ask[slip]?'#ask-'+slip:'#mk-save'});
  },
  extra(){S.extra=true;S.marksOpen=true;render({scroll:'#marks',focus:'input.mk'});},
  settings(){
    if(PAGE==='settings')return;
    const go=()=>{S.drafts={};S.err={};S.ask={};S.okd={};S.form={};S.ferr={};S.npOpen=null;S.sale=null;S.refuse=null;S.msg='';PAGE='settings';S.cfgOpen={stock:String(CFG.stock),up:String(CFG.optUp),down:String(CFG.optDown),err:'',saved:false};render({focus:'#cfg-stock'});window.scrollTo(0,0);};
    if(unsaved()){const n=unsavedMarks(),id=S.ids.find(dirty);dialog('Leave without saving?',n?n+' unsaved Mark'+(n===1?'':'s')+'.':id+'’s Action note isn’t saved.','Leave','Stay',go);}else go();},
  review(){if(PAGE==='review')return;PAGE='review';S.cfgOpen=null;render();window.scrollTo(0,0);const el=document.getElementById('cfg-link')||document.getElementById('daycard');if(el)el.focus({preventScroll:true});},
  'cfg-save'(){const c=S.cfgOpen,n=x=>/^\d*\.?\d+$/.test(x.trim())?parseFloat(x):NaN,a=n(c.stock),b=n(c.up),d=n(c.down);c.saved=false;
    if(!(a>0)||!(b>0)||!(d>0)){c.err='Enter a percentage above 0 in each box.';render({focus:'#cfg-'+(!(a>0)?'stock':(!(b>0)?'up':'down'))});return;}
    if(d>=100){c.err='An option can’t fall 100%: enter less than 100.';render({focus:'#cfg-down'});return;}
    CFG.stock=a;CFG.optUp=b;CFG.optDown=d;c.err='';c.saved=true;render({focus:'#back-review'});},
  'np-open'(el){const k=el.dataset.key;S.npOpen=k;S.npText='';refreshCell(k);const i=document.getElementById('np-'+k);if(i)i.focus();},
  'np-cancel'(el){const k=S.npOpen;S.npOpen=null;if(k){refreshCell(k);const i=document.getElementById('mk-'+k);if(i)i.focus();}},
  'np-save'(el){const k=el.dataset.key,why=(S.npText||'').trim(),i=document.getElementById('np-'+k);
    if(!why){if(i){i.style.borderColor='var(--stop)';i.placeholder='Say why there is no price';i.focus();}return;}
    S.np[k]=why;delete S.drafts[k];delete S.err[k];delete S.ask[k];S.npOpen=null;afterMarks();},
  'np-undo'(el){const k=el.dataset.key;delete S.np[k];S.marksOpen=true;render({focus:'#mk-'+k});},
  ask(el){const k=el.dataset.key,v=el.dataset.v,i=document.getElementById('mk-'+k);delete S.ask[k];
    if(v===''){delete S.drafts[k];i.value='';refreshCell(k);i.focus();return;}
    setDraft(k,v);S.okd[k]=v;i.value=v;refreshCell(k);moveCell(i,1,true);},
  pick(el,id){const f=formOf(T(id));f.a=el.dataset.a;delete S.ferr[id];render({focus:'#act-'+id+'-'+f.a});},
  conv(el,id){const f=formOf(T(id)),n=+el.dataset.n;f.conv=f.conv===n?0:n;render({focus:'#conv-'+id+'-'+n});},
  'save-act'(el,id){saveAction(id);},
  'discard-act'(el,id){delete S.form[id];delete S.ferr[id];render({focus:'#act-'+id+'-Hold'});},
  change(el,id){const a=S.today[id];S.form[id]={a:a.a,why:a.why,conv:a.conv||0,alt:a.alt||'',note:a.note||''};delete S.today[id];render({focus:'#act-'+id+'-'+a.a});},
  'refuse-save'(){const r=S.refuse;saveAction(r.from,r.at);},
  'refuse-discard'(){const r=S.refuse;delete S.form[r.from];delete S.ferr[r.from];S.refuse=null;S.open=null;openCard(r.at,true);},
  'refuse-back'(){const r=S.refuse;S.refuse=null;render({scroll:'#card-'+r.from,focus:'#why-'+r.from});},
  'stale-ack'(){S.staleAck=true;render({focus:'#next'});},
  sale(el,id){S.sale={id,q:String(Math.abs(held(T(id),S.date))),p:'',err:'',what:'',rerr:''};S.refuse=null;S.open=id;render({scroll:'#card-'+id,focus:'#sale-p'});},
  'sale-cancel'(){const id=S.sale.id;S.sale=null;render({focus:'#head-'+id});},
  'sale-save'(){
    const s=S.sale,t=T(s.id),h=Math.abs(held(t,S.date)),q=parseInt(s.q,10),ptxt=norm(s.p);s.err='';s.rerr='';
    if(!(q>=1&&q<=h)||String(q)!==s.q.trim()){s.err='Quantity: 1 to '+h+'.';render({focus:'#sale-q'});return;}
    if(!/^\d*\.?\d+$/.test(ptxt)){s.err='Enter the price.';render({focus:'#sale-p'});return;}
    const p=parseFloat(ptxt),pc=planCheck(t,q,p),dec=exitDecision(t);
    const part=pc.why.some(w=>w.k==='part'),carried=!!(dec&&dec.why)&&pc.why.some(w=>w.k!=='part'),ask=pc.why.length>0&&(part||!carried),what=ask?s.what.trim():'';
    if(ask&&!what){s.rerr='Say why.';render({focus:'#sale-what'});return;}
    const kinds={early:'before a line was reached',late:'held past the '+pc.name,part:(t.side>0?'sold':'bought back')+' part'};
    const txt=!pc.why.length?'Followed the Plan: out at the '+pc.name+'.':'Left the Plan ('+pc.why.map(w=>kinds[w.k]).join(', ')+').'+(carried?' Why, '+dl(dec.d)+': <q>'+esc(dec.why)+'</q>':'')+(what?' '+(carried?'Why only part':'Why')+': <q>'+esc(what)+'</q>':'');
    (S.refl[t.id]=S.refl[t.id]||[]).push({d:S.date,q,p,txt});
    t.execs.push({d:S.date,q:-t.side*q,p});S.sale=null;
    if(held(t,S.date)===0)closeOut(t);else{delete S.today[t.id];render({focus:'#head-'+t.id});}
  },
  'settle-later'(el,id){const t=T(id);t.later=t.side>0?'Exercised':'Assigned';t.settled=true;S.worth=null;advance();},
  'settle-undo'(el,id){const t=T(id);delete t.later;t.settled=false;render({focus:'#settle-main-'+id});},
  'settle-exp'(el,id){const t=T(id);t.execs.push({d:S.date,q:-held(t,S.date),p:0,kind:'exp'});t.settled=true;closeOut(t);},
  'settle-worth'(el,id){S.worth=id;S.worthWhy='';S.worthErr=false;render({focus:'#worth-why'});},
  'settle-worth-cancel'(){const id=S.worth;S.worth=null;render({focus:'#settle-main-'+id});},
  'settle-worth-save'(el,id){if(!(S.worthWhy||'').trim()){S.worthErr=true;render({focus:'#worth-why'});return;}ACT['settle-exp'](el,id);},
  'carry-on'(){S.justClosed=null;advance();},
  replay(el,id){const t=T(id),ms=moments(t);let sel=lastOf(t);if(isOpen(t)){const k=standing(t,sel).k;if(k==='stop')sel=firstEver(t,sel,t.stop);else if(k==='target')sel=firstEver(t,sel,t.target);}S.replay={id,mode:'daily',ms,seen:{},sel};renderOv('#r-slide');},
  'cr-write'(el,id){const t=T(id),ms=moments(t);S.replay={id,mode:'close',ms,mi:0,seen:{0:true},sel:ms[0].d,ans:S.crAns[id]||(S.crAns[id]={again:'',worked:'',lesson:''}),err:{}};renderOv('#mom-next');},
  'r-close'(){if(!S.replay)return;const id=S.replay.id,close=S.replay.mode==='close';S.replay=null;renderOv();const el=document.getElementById(close?'cr-write-'+id:'rp-'+id);if(el)el.focus();},
  'r-prev'(){S.replay.sel--;updOv();},
  'r-next'(){S.replay.sel++;updOv();},
  rsel(el){S.replay.sel=+el.dataset.d;updOv();},
  'mom-next'(){const R=S.replay;let i=R.ms.findIndex((m,j)=>!R.seen[j]);if(i<0)i=R.ms.length-1;R.seen[i]=true;R.sel=R.ms[i].d;updOv();updForm();const b=document.getElementById('mom-next')||document.getElementById('cr-again-0');if(b)b.focus();},
  'cr-pick'(el){const R=S.replay,k=el.dataset.k;R.ans[k]=el.dataset.v;delete R.err[k];updForm();const b=[...document.querySelectorAll('#ov-form [data-act="cr-pick"]')].find(x=>x.dataset.k===k&&x.dataset.v===R.ans[k]);if(b)b.focus();},
  'cr-save'(){const R=S.replay,a=R.ans;R.err={};
    for(const f of CR_FIELDS)if(f.req&&!String(a[f.k]||'').trim())R.err[f.k]=true;
    const bad=CR_FIELDS.find(f=>R.err[f.k]);
    if(bad){updForm();const b=document.getElementById(bad.opts?'cr-'+bad.k+'-0':'cr-'+bad.k);if(b)b.focus();return;}
    const id=R.id;S.cr[id]={status:'done',ans:{again:a.again,worked:a.worked.trim(),lesson:a.lesson.trim()}};S.replay=null;renderOv();afterCR(id);},
  decl(el,id){S.decl=id;S.declWhy='';render({focus:'#decl-why'});},
  'decl-cancel'(){const id=S.decl;S.decl=null;render({focus:'#cr-write-'+id});},
  'decl-save'(el,id){S.cr[id]={status:'declined',why:(S.declWhy||'').trim()};S.decl=null;afterCR(id);}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f)f(el,el.dataset.id,e);});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.classList.contains('mk')){const k=el.dataset.key;setDraft(k,el.value);delete S.err[k];delete S.ask[k];delete S.okd[k];refreshCell(k);return;}
  const k=el.dataset.in;if(!k)return;
  if(k==='why'||k==='alt'||k==='note'){const id=el.dataset.id;formOf(T(id))[k]=el.value;if(k==='why'&&S.ferr[id]&&S.ferr[id].why){delete S.ferr[id].why;el.classList.remove('bad');}}
  else if(k==='sale-q'||k==='sale-p'){S.sale[k.slice(5)]=el.value;const r=document.getElementById('sale-refl');if(r)r.outerHTML=reflPart(T(S.sale.id));}
  else if(k==='cfg-stock'||k==='cfg-up'||k==='cfg-down'){S.cfgOpen[k.slice(4)]=el.value;S.cfgOpen.saved=false;const ok=document.getElementById('cfg-ok');if(ok)ok.textContent='';}
  else if(k==='sale-what'){S.sale.what=el.value;if(S.sale.rerr){S.sale.rerr='';el.classList.remove('bad');const m=el.parentNode.querySelector('.errmsg');if(m)m.remove();}}
  else if(k==='mom-sel'){if(el.value!==''){S.replay.sel=S.replay.ms[+el.value].d;updOv();}}
  else if(k==='np')S.npText=el.value;else if(k==='worth-why')S.worthWhy=el.value;else if(k==='decl-why')S.declWhy=el.value;
  else if(k==='cr-field'){const f=el.dataset.k,R=S.replay;R.ans[f]=el.value;if(R.err[f]){delete R.err[f];el.classList.remove('bad');const m=el.parentNode.querySelector('.errmsg');if(m)m.remove();}}
  else if(k==='r-slide'){S.replay.sel=+el.value;updOv();}
});
document.addEventListener('focusout',e=>{const el=e.target;if(el.classList&&el.classList.contains('mk')&&document.body.contains(el)){const k=el.dataset.key,rt=e.relatedTarget;if(rt&&rt.dataset&&rt.dataset.key===k&&rt!==el)return;if(S.npOpen===k)return;validate(k);refreshCell(k);}});
document.addEventListener('keydown',e=>{
  const el=e.target;
  if(e.key==='Escape'){if(S.dialog){closeDlg();return;}if(S.replay){ACT['r-close']();return;}}
  if(S.replay&&!/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)){if(e.key==='ArrowLeft'){ACT['r-prev']();e.preventDefault();}else if(e.key==='ArrowRight'){ACT['r-next']();e.preventDefault();}}
  if(el.classList&&el.classList.contains('mk')){
    const k=el.dataset.key;
    if(e.key==='Enter'){e.preventDefault();const ok=validate(k);refreshCell(k);if(S.ask[k]){const b=document.getElementById('ask-'+k);if(b)b.focus();}else if(!ok)el.select();else moveCell(el,1,true);}
    else if(e.key==='ArrowDown'){e.preventDefault();moveCell(el,1,false);}
    else if(e.key==='ArrowUp'){e.preventDefault();moveCell(el,-1,false);}
    else if((e.key==='n'||e.key==='N')&&el.dataset.main==='1'&&el.value===''&&mk(T(k.split('-')[0]),k.split('-')[1],S.date)==null){e.preventDefault();ACT['np-open'](el);}
    else if(e.key==='Escape'){const a=k.split('-'),sv=S.marks[a[0]][a[1]][+a[2]];delete S.drafts[k];delete S.err[k];delete S.ask[k];el.value=sv==null?'':sv.toFixed(2);refreshCell(k);}
    return;
  }
  if(e.key==='Enter'&&el.dataset&&el.dataset.in==='np'){e.preventDefault();ACT['np-save'](el);}
  if(e.key==='Enter'&&(el.id==='sale-p'||el.id==='sale-q')){e.preventDefault();ACT['sale-save']();}
  if(e.key==='Enter'&&/^cfg-(stock|up|down)$/.test(el.id)){e.preventDefault();ACT['cfg-save']();}
});
window.addEventListener('beforeunload',e=>{if(S&&unsaved()){e.preventDefault();e.returnValue='';}});
setup(SCN.some(s=>s[0]===location.hash.slice(1))?location.hash.slice(1):'work');render();

</script>
